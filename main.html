<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Project Zero</title>
    <style>
        /* ===== 任務 8：響應式變數與基礎設定 ===== */
        :root {
            --primary: #00F9C7;
            --sidebar-bg: #a3d9c9;
            --header-h: 50px;
            --sidebar-w: 200px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; height: 100%; overflow: hidden; 
            background: #000; font-family: "Noto Sans TC", sans-serif; 
        }

        /* ===== 任務 1：Header 優化 ===== */
        .header-wrapper {
            width: 100%; height: var(--header-h); background: var(--primary);
            display: flex; align-items: center; padding: 0 15px;
            z-index: 1002; position: relative;
        }

        .header-title {
            flex: 1; font-size: clamp(16px, 4.5vw, 22px);
            font-weight: 700; color: #0D0D0D;
        }

        .welcome-text { font-size: 12px; opacity: 0.7; letter-spacing: 2px; }

        /* --- 漢堡選單 (任務 2) --- */
        .hamburger {
            width: 45px; height: 100%; display: flex; flex-direction: column;
            justify-content: center; gap: 5px; cursor: pointer; border: none; background: none;
        }
        .hamburger span {
            width: 24px; height: 3px; background: #0D0D0D;
            border-radius: 2px; transition: var(--transition);
        }
        /* 變形成 X 的修正 (任務 2) */
        .active .hamburger span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
        .active .hamburger span:nth-child(2) { opacity: 0; }
        .active .hamburger span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

        @media (min-width: 768px) { .hamburger { display: none; } }

        /* ===== 任務 2：Sidebar 抽屜式設計 ===== */
        .sidebar {
            position: fixed; top: var(--header-h); left: -100%; /* 預設藏起來 */
            width: 260px; height: calc(100vh - var(--header-h));
            background: var(--sidebar-bg); z-index: 1001;
            transition: var(--transition); display: flex; flex-direction: column;
        }
        .active .sidebar { left: 0; }

        .nav-links { flex: 1; padding: 20px 0; }
        .sidebar a {
            display: block; padding: 15px 25px; color: #0D0D0D;
            text-decoration: none; font-weight: 600; min-height: 48px; /* 任務 9 */
        }
        .sidebar a:active { background: rgba(0,0,0,0.1); }

        /* 遮罩層 */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); opacity: 0; visibility: hidden;
            transition: var(--transition); z-index: 1000;
        }
        .active .overlay { opacity: 1; visibility: visible; }

        /* ===== 內容區佈局 ===== */
        .layout { display: flex; height: calc(100vh - var(--header-h)); width: 100%; }
        .content-area { flex: 1; position: relative; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }

        /* 桌面版恢復靜態側邊欄 (任務 8) */
        @media (min-width: 768px) {
            .sidebar { position: static; width: var(--sidebar-w); left: 0; }
            .overlay { display: none; }
        }

        /* 音樂/狗狗組件 */
        .sidebar-bottom { padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        #music-ui img { width: 60px; cursor: pointer; transition: 0.3s; }
        .dog-container img { width: 45px; }
    </style>
</head>
<body>

<audio id="bgm" loop><source src="Music/Music.mp3" type="audio/mpeg"></audio>

<div id="main-layout">
    <div class="overlay" onclick="toggleMenu()"></div>
    
    <header class="header-wrapper">
        <button class="hamburger" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </button>
        <div class="header-title">Project Zero / 零計畫</div>
        <div class="welcome-text">Welcome</div>
    </header>

    <div class="layout">
        <nav class="sidebar">
            <div class="nav-links">
                <a href="home.html" target="content-frame">自介</a>
                <a href="diary.html" target="content-frame">日記</a>
                <a href="blog.html" target="content-frame">部落格</a>
                <a href="gallery.html" target="content-frame">相簿</a>
                <a href="collections.html" target="content-frame">收藏</a>
            </div>
            <div class="sidebar-bottom">
                <div id="music-ui" onclick="togglePlay()"><img id="btn-img" src="Music/IMG_3115.png"></div>
                <div class="dog-container"><img src="GIF_20251224164146204.gif"></div>
            </div>
        </nav>
        <main class="content-area">
            <iframe src="home.html" name="content-frame"></iframe>
        </main>
    </div>
</div>

<script>
    function toggleMenu() { document.getElementById('main-layout').classList.toggle('active'); }
    
    // 音樂控制邏輯
    const audio = document.getElementById('bgm');
    const img = document.getElementById('btn-img');
    function togglePlay() {
        if (audio.paused) { audio.play(); img.src = "Music/IMG_3116.png"; }
        else { audio.pause(); img.src = "Music/IMG_3115.png"; }
    }
</script>
</body>
</html>
