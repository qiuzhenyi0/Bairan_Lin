<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <style>
        body { background: #000; color: #fff; padding: 15px; font-family: sans-serif; line-height: 1.6; }
        
        /* 任務 5：文字方框優化 */
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 249, 199, 0.3);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            max-width: 800px; /* 任務 3 */
        }

        .title { color: var(--primary, #00F9C7); font-size: 22px; margin-bottom: 15px; }

        /* 任務 7：社群按鈕 */
        .social-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        .social-group a {
            color: #00F9C7; border: 1px solid #00F9C7;
            padding: 8px 16px; border-radius: 6px; text-decoration: none;
            font-size: 14px; min-height: 44px; display: flex; align-items: center;
        }

        /* 任務 4：圖片滑動牆 (核心修正) */
        .slider {
            display: flex; overflow-x: auto; gap: 12px;
            scroll-snap-type: x mandatory; padding-bottom: 10px;
            scrollbar-width: none; /* 隱藏捲軸 */
        }
        .slider::-webkit-scrollbar { display: none; }
        .slider img {
            flex: 0 0 150px; /* 手機版寬度 */
            height: 150px; object-fit: cover;
            border-radius: 8px; scroll-snap-align: start;
        }

        @media (min-width: 768px) {
            .slider img { flex: 0 0 200px; height: 200px; }
        }
    </style>
</head>
<body>
    <h2 class="title">歡迎回來</h2>
    <div class="social-group">
        <a href="#">Instagram</a> <a href="#">Facebook</a> <a href="#">X (Twitter)</a>
    </div>

    <div class="card">
        <h3 class="title">自介</h3>
        <p># 玲帕染 / Bairan Lin</p>
        <p># 台灣 | INTJ-T</p>
        <p># Python / HTML / C++ / JS</p>
    </div>

    <div class="card">
        <h3 class="title">光遇工作室</h3>
        <div class="slider">
            <img src="your-image-1.jpg">
            <img src="your-image-2.jpg">
            <img src="your-image-3.jpg">
            <img src="your-image-4.jpg">
        </div>
    </div>
</body>
</html>
