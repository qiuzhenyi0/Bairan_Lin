<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>Project Zero | Birthday Celebration</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    
    <style>
        :root {
            --primary-bg: #00F9C7;
            --sidebar-bg: #a3d9c9;
            --text-dark: #0D0D0D;
            --header-h-mobile: 50px;
            --header-h-desktop: 70px;
            --sidebar-w-desktop: 220px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            width: 100%; 
            height: 100dvh; /* 確保不被手機網址列吃掉 */
            overflow: hidden;
            background: #000;
            font-family: "Noto Sans TC", sans-serif;
        }

        /* 版面配置 */
        .layout {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .header-wrapper {
            width: 100%;
            height: var(--header-h-mobile);
            background: var(--primary-bg);
            display: flex;
            align-items: center;
            padding: 0 15px;
            z-index: 1000;
            position: relative;
        }

        .header-title {
            flex: 1;
            font-size: clamp(16px, 4.5vw, 24px);
            font-weight: 800;
            color: var(--text-dark);
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        /* 漢堡選單 */
        .menu-toggle {
            width: 48px; height: 48px;
            display: flex; flex-direction: column;
            justify-content: center; gap: 6px;
            cursor: pointer; border: none; background: none;
            margin-right: 10px;
        }
        .menu-toggle span { width: 24px; height: 3px; background: var(--text-dark); border-radius: 2px; }

        /* Sidebar 邏輯 */
        .sidebar {
            position: fixed;
            top: var(--header-h-mobile);
            left: -280px;
            width: 280px;
            height: calc(100% - var(--header-h-mobile));
            background: var(--sidebar-bg);
            transition: var(--transition);
            z-index: 999;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
        }
        .layout.active .sidebar { left: 0; }

        .sidebar a {
            display: flex; align-items: center;
            padding: 15px 25px;
            text-decoration: none; color: var(--text-dark);
            font-weight: 600;
        }

        /* 畫布區域 */
        .main-content {
            flex: 1;
            position: relative;
            background: #000;
            overflow: hidden;
        }

        #output_canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 浮動 UI 文字 */
        .festival-ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00F9C7;
            z-index: 10;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            opacity: 0; visibility: hidden; transition: var(--transition);
            z-index: 998;
        }
        .layout.active .overlay { opacity: 1; visibility: visible; }

        @media (min-width: 768px) {
            .menu-toggle { display: none; }
            .sidebar { position: static; left: 0; width: var(--sidebar-w-desktop); height: 100%; }
            .header-wrapper { height: var(--header-h-desktop); padding: 0 40px; }
        }
    </style>
</head>
<body>

<div class="layout" id="layout">
    <div class="overlay" onclick="toggleMenu()"></div>

    <header class="header-wrapper">
        <button class="menu-toggle" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </button>
        <div class="header-title">Project Zero / 零計畫</div>
    </header>

    <div class="main-container">
        <nav class="sidebar">
            <a href="#">首頁</a>
            <a href="#">日記</a>
            <a href="#">部落格</a>
            <a href="#">相簿</a>
            <a href="#">收藏</a>
            <a href="#">幸運指數</a>
            <a href="#">節慶</a>
            <div style="margin-top: auto; padding: 20px; text-align: center;">
                <small>v1.0.5 Centered Fix</small>
            </div>
        </nav>

        <main class="main-content" id="canvas_container">
            <div class="festival-ui">
                <h2>Birthday Celebration🍰 5/17</h2>
                <p id="status-text">握拳：聚集粒子 / 張手：散開粒子</p>
            </div>
            <canvas id="output_canvas"></canvas>
            <video id="input_video" style="display:none;" playsinline></video>
        </main>
    </div>
</div>

<script>
    function toggleMenu() {
        document.getElementById('layout').classList.toggle('active');
    }

    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const container = document.getElementById('canvas_container');
    const statusText = document.getElementById('status-text');
    
    let particles = [], textPoints = [], isFist = false, currentHand = { x: 0.5, y: 0.5 };
    const PARTICLE_COUNT = 1800; 

    function initText() {
        // 同步畫布尺寸到實際容器大小
        const w = container.clientWidth;
        const h = container.clientHeight;
        canvasElement.width = w;
        canvasElement.height = h;

        const tCanvas = document.createElement('canvas');
        const tCtx = tCanvas.getContext('2d');
        tCanvas.width = w; tCanvas.height = h;
        
        tCtx.fillStyle = "white"; 
        tCtx.textAlign = "center";
        
        // 微調字體大小，避免小螢幕超出
        const fontSize = Math.min(w / 8, 45); 
        tCtx.font = `bold ${fontSize}px Arial`;
        
        // 基準點：強制鎖死在「畫面絕對正中央」
        const cx = w / 2;
        const cy = h / 2; 
        
        // 固定像素距離，避免手機長寬比造成位移
        tCtx.fillText("HAPPY BIRTHDAY", cx, cy - 70);
        tCtx.fillText("TO ME", cx, cy - 20);
        
        // 蛋糕緊跟在文字下方 50px 處
        const cakeY = cy + 50; 
        
        // 繪製蛋糕形狀 (全部對齊 cakeY)
        tCtx.fillRect(cx - 50, cakeY + 20, 100, 25); // 底
        tCtx.fillRect(cx - 35, cakeY, 70, 20);       // 中
        tCtx.fillRect(cx - 20, cakeY - 20, 40, 20);  // 頂
        
        tCtx.fillRect(cx - 15, cakeY - 35, 3, 15);   // 蠟燭 L
        tCtx.fillRect(cx - 1.5, cakeY - 40, 3, 20);  // 蠟燭 M
        tCtx.fillRect(cx + 12, cakeY - 35, 3, 15);   // 蠟燭 R
        
        [[cx - 13.5, cakeY - 40, 3], [cx, cakeY - 47, 4], [cx + 13.5, cakeY - 40, 3]].forEach(p => {
            tCtx.beginPath();
            tCtx.arc(p[0], p[1], p[2], 0, Math.PI*2);
            tCtx.fill();
        });

        // 讀取像素轉換為目標點
        const data = tCtx.getImageData(0, 0, w, h).data;
        textPoints = [];
        for (let y = 0; y < h; y += 2) {
            for (let x = 0; x < w; x += 2) {
                if (data[(y * w + x) * 4 + 3] > 128) {
                    textPoints.push({ x: x - w/2, y: y - h/2 });
                }
            }
        }
    }

    class Particle {
        constructor(id) {
            this.id = id;
            this.x = Math.random() * window.innerWidth;
            this.y = Math.random() * window.innerHeight;
            this.v = { x: (Math.random()-0.5)*5, y: (Math.random()-0.5)*5 };
            this.hue = Math.random() * 40 + 330; 
            this.bri = 50;
        }
        update() {
            if (isFist && textPoints.length > 0) {
                let pt = textPoints[this.id % textPoints.length];
                
                // ⚠️ 關鍵：不論手在哪裡，都強制把目標點設在畫面中心 (0.5)
                let tx = canvasElement.width * 0.5 + pt.x;
                let ty = canvasElement.height * 0.5 + pt.y;
                
                this.x += (tx - this.x) * 0.15;
                this.y += (ty - this.y) * 0.15;
                this.bri = 60 + Math.random() * 40;
            } else {
                this.x += this.v.x;
                this.y += this.v.y;
                if(this.x < 0 || this.x > canvasElement.width) this.v.x *= -1;
                if(this.y < 0 || this.y > canvasElement.height) this.v.y *= -1;
                
                // 張開手時，粒子會輕輕躲避手的座標
                let dx = this.x - (currentHand.x * canvasElement.width);
                let dy = this.y - (currentHand.y * canvasElement.height);
                if (Math.hypot(dx, dy) > 200) { this.v.x -= dx * 0.001; this.v.y -= dy * 0.001; }
                this.bri = 50;
            }
        }
        draw() {
            canvasCtx.fillStyle = `hsl(${this.hue}, 100%, ${this.bri}%)`;
            canvasCtx.beginPath();
            canvasCtx.arc(this.x, this.y, isFist ? 2.2 : 1.5, 0, Math.PI*2);
            canvasCtx.fill();
        }
    }

    // 視窗縮放重新計算
    window.addEventListener('resize', () => {
        initText();
    });

    initText();
    for(let i=0; i<PARTICLE_COUNT; i++) particles.push(new Particle(i));

    function animate() {
        canvasCtx.fillStyle = "rgba(0,0,0,0.15)";
        canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);
        particles.forEach(p => { p.update(); p.draw(); });
        requestAnimationFrame(animate);
    }
    animate();

    // 初始化 MediaPipe
    const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
    hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
    
    hands.onResults(res => {
        if (res.multiHandLandmarks && res.multiHandLandmarks.length > 0) {
            const h = res.multiHandLandmarks[0];
            const dist = Math.hypot(h[8].x - h[4].x, h[8].y - h[4].y);
            isFist = dist < 0.1; 
            currentHand = { x: 1 - h[9].x, y: h[9].y };
            
            // 根據動作更新狀態文字
            statusText.innerText = isFist ? "✨ 聚集驚喜中 ✨" : "握拳：聚集粒子 / 張手：散開粒子";
        } else { 
            isFist = false; 
            statusText.innerText = "握拳：聚集粒子 / 張手：散開粒子";
        }
    });
    
    const camera = new Camera(videoElement, { 
        onFrame: async () => { await hands.send({image: videoElement}); }, 
        width: 1280, height: 720 
    });
    camera.start();
</script>
</body>
</html>
