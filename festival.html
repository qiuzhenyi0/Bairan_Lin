<script>
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    let particles = [], textPoints = [], isFist = false, currentHand = { x: 0.5, y: 0.5 };

    function initText() {
        const tCanvas = document.createElement('canvas');
        const tCtx = tCanvas.getContext('2d');
        tCanvas.width = 1200; 
        tCanvas.height = 350;
        
        tCtx.fillStyle = "white"; 
        tCtx.font = "bold 70px Arial";
        tCtx.textAlign = "center"; 
        tCtx.textBaseline = "middle";
        
        tCtx.fillText("HAPPY BIRTHDAY", 600, 90);
        tCtx.fillText("TO ME", 600, 170);
        tCtx.font = "100px Arial";
        tCtx.fillText("🍰", 600, 280);
        
        const imageData = tCtx.getImageData(0, 0, tCanvas.width, tCanvas.height);
        const data = imageData.data;
        
        for (let i = 0; i < data.length; i += 4) {
            if (data[i + 3] > 128) {
                const pixelIndex = i / 4;
                const x = pixelIndex % tCanvas.width;
                const y = Math.floor(pixelIndex / tCanvas.width);
                textPoints.push({ 
                    x: x - tCanvas.width / 2, 
                    y: y - tCanvas.height / 2 
                });
            }
        }
        console.log("Text points count:", textPoints.length);
    }

    class Particle {
        constructor() {
            this.x = Math.random() * canvasElement.width; 
            this.y = Math.random() * canvasElement.height;
            this.v = { x: (Math.random()-0.5)*4, y: (Math.random()-0.5)*4 };
            this.hue = Math.random()*60 + 150;
            this.bri = 50;
        }
        update() {
            if (isFist && textPoints.length > 0) {
                const ptIdx = Math.floor(Math.random() * textPoints.length);
                const pt = textPoints[ptIdx];
                const tx = currentHand.x * canvasElement.width + pt.x * 1.2;
                const ty = currentHand.y * canvasElement.height + pt.y * 1.2;
                this.x += (tx - this.x) * 0.15;
                this.y += (ty - this.y) * 0.15;
                this.bri = Math.random() * 50 + 50;
            } else {
                this.x += this.v.x;
                this.y += this.v.y;
                
                const handX = currentHand.x * canvasElement.width;
                const handY = currentHand.y * canvasElement.height;
                const dx = this.x - handX;
                const dy = this.y - handY;
                const dist = Math.hypot(dx, dy);
                
                if (dist < 300) {
                    this.v.x -= (dx / dist) * 0.3;
                    this.v.y -= (dy / dist) * 0.3;
                }
                
                this.bri = 50;
                
                if (this.x < 0 || this.x > canvasElement.width) this.v.x *= -0.8;
                if (this.y < 0 || this.y > canvasElement.height) this.v.y *= -0.8;
                
                if (this.v.x > 6) this.v.x = 6;
                if (this.v.y > 6) this.v.y = 6;
            }
        }
        draw() {
            canvasCtx.fillStyle = `hsl(${this.hue}, 100%, ${this.bri}%)`;
            canvasCtx.beginPath();
            canvasCtx.arc(this.x, this.y, isFist ? 2.5 : 1.8, 0, Math.PI * 2);
            canvasCtx.fill();
        }
    }

    initText();
    for (let i = 0; i < 800; i++) particles.push(new Particle());

    function animate() {
        canvasElement.width = window.innerWidth;
        canvasElement.height = window.innerHeight;
        
        canvasCtx.fillStyle = "rgba(0,0,0,0.2)";
        canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);
        
        particles.forEach(p => {
            p.update();
            p.draw();
        });
        
        requestAnimationFrame(animate);
    }
    animate();

    const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });
    hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
    });
    hands.onResults(res => {
        if (res.multiHandLandmarks && res.multiHandLandmarks.length > 0) {
            const h = res.multiHandLandmarks[0];
            const fingerTip = h[8];
            const fingerBase = h[5];
            const palmBase = h[0];
            
            const distance = Math.hypot(fingerTip.x - palmBase.x, fingerTip.y - palmBase.y);
            isFist = distance < 0.15;
            
            currentHand = { x: 1 - h[9].x, y: h[9].y };
        } else {
            isFist = false;
        }
    });
    
    const camera = new Camera(videoElement, {
        onFrame: async () => {
            await hands.send({image: videoElement});
        },
        width: 1280,
        height: 720
    });
    camera.start();
</script>
